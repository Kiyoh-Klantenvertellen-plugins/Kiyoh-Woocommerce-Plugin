name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint plugin PHP files
        run: |
          set -euo pipefail
          find kiyoh-woocommerce-plugin/kiyoh-woocommerce -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run unit tests
        run: |
          set -euo pipefail
          for test in tests/*.php; do
            echo "== ${test} =="
            php "${test}"
          done